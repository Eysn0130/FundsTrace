name: Windows shortcut diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shortcut:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect only the disposable published-installer shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $output = Join-Path $env:RUNNER_TEMP 'fundstrace-shortcut-diagnostic.json'
          ./scripts/test-windows-installer.ps1 -PreflightOnly -InstallerPath (Join-Path $env:RUNNER_TEMP 'unused.exe') -ReportPath (Join-Path $env:RUNNER_TEMP 'fundstrace-shortcut-preflight.json')
          if ($LASTEXITCODE -ne 0) { throw 'Isolated installer preflight failed.' }
          $source = Get-Content -Raw 'scripts/test-windows-brand-icon.ps1'
          $native = [regex]::Match($source, "(?s)Add-Type @'\r?\n(.*?)\r?\n'@")
          if (-not $native.Success) { throw 'Native reader source unavailable.' }
          Add-Type -TypeDefinition $native.Groups[1].Value
          $root = Join-Path ([IO.Path]::GetTempPath()) ('FundsTrace 安装 生命周期 ' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          $install = Join-Path $root '应用 安装路径'
          $installer = Join-Path $root 'prior-stable.exe'
          $report = [ordered]@{ schemaVersion=1; status='running'; shortcuts=@(); cleanup=$false }
          function Display-CiPath([string]$value) {
            foreach ($entry in @(@([IO.Path]::GetTempPath(), '<CI_TEMP>\'), @($env:USERPROFILE, '<CI_USER>'), @($env:GITHUB_WORKSPACE, '<CI_WORKSPACE>'))) {
              if ($entry[0]) { $value = [regex]::Replace($value, [regex]::Escape([string]$entry[0]), [string]$entry[1], [Text.RegularExpressions.RegexOptions]::IgnoreCase) }
            }
            return $value
          }
          function Run-OwnedInstaller([string]$file, [string]$arguments) {
            $start=[Diagnostics.ProcessStartInfo]::new(); $start.FileName=$file; $start.Arguments=$arguments; $start.UseShellExecute=$false
            $child=[Diagnostics.Process]::Start($start)
            try { if (-not $child.WaitForExit(180000) -or $child.ExitCode -ne 0) { throw 'Owned installer failed.' } }
            finally { $child.Dispose() }
          }
          try {
            Invoke-WebRequest -Uri 'https://github.com/Eysn0130/FundsTrace/releases/download/v0.1.7/FundsTrace-0.1.7-windows-x64-unsigned.exe' -OutFile $installer -TimeoutSec 180
            if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne '52eabd3c6b0f77270c61066b8d1830b84cb5b316153d399625c7d21badfbeb7a') { throw 'Published installer digest differs.' }
            Run-OwnedInstaller $installer "/S /D=$install"
            $expected = Join-Path $install 'FundsTrace.exe'
            $shell = New-Object -ComObject WScript.Shell
            try {
              foreach ($location in @([Environment+SpecialFolder]::DesktopDirectory, [Environment+SpecialFolder]::Programs)) {
                $linkPath = Join-Path ([Environment]::GetFolderPath($location)) 'FundsTrace.lnk'
                $link=$shell.CreateShortcut($linkPath)
                try {
                  $target=[string]$link.TargetPath
                  $report.shortcuts += [ordered]@{ location=$location.ToString(); exists=(Test-Path -LiteralPath $linkPath -PathType Leaf)
                    expected=(Display-CiPath $expected); target=(Display-CiPath $target); icon=(Display-CiPath ([string]$link.IconLocation))
                    expectedExists=(Test-Path -LiteralPath $expected -PathType Leaf); targetExists=(Test-Path -LiteralPath $target -PathType Leaf)
                    sameFile=[FundsTraceBrandIcons]::SameFile($target,$expected) }
                } finally { [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($link) }
              }
            } finally { [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($shell) }
            $report.status='passed'
          } finally {
            $uninstaller=Join-Path $install 'Uninstall FundsTrace.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) { Run-OwnedInstaller $uninstaller "/S _?=$install" }
            Remove-Item -LiteralPath $root -Recurse -Force
            $report.cleanup=$true
            $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $output -Encoding utf8
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fundstrace-shortcut-diagnostic-${{ github.run_id }}
          retention-days: 3
          path: ${{ runner.temp }}/fundstrace-shortcut-diagnostic.json
          if-no-files-found: warn

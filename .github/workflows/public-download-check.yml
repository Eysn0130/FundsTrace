name: Public download readback

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/release-publisher/verify-public*
      - .github/workflows/public-download-check.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Expected latest stable tag; leave empty to resolve the current public version
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: public-download-readback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - name: Install locked dependencies without install scripts
        run: npm ci --prefix scripts/release-publisher --ignore-scripts --no-audit --no-fund
      - name: Select the expected public version without cloud credentials
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { selectRelease } from './scripts/release-publisher/publish.mjs';
          const response = await fetch('https://api.github.com/repos/Eysn0130/FundsTrace/releases/latest', {
            headers: { Accept: 'application/json' }, signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error('Cannot resolve the latest public release');
          const latest = selectRelease(await response.json());
          const tag = process.env.REQUESTED_TAG || `v${latest.version}`;
          if (!/^v0\.1\.(0|[1-9]\d*)$/.test(tag)) throw new Error('Invalid expected tag');
          appendFileSync(process.env.GITHUB_ENV, `EXPECTED_TAG=${tag}\n`);
          console.log(`Read-only metadata check for ${tag}; no installer download or publication`);
          NODE
      - name: Require the current verifier to validate all public metadata
        run: node scripts/release-publisher/verify-public.mjs
      - name: Verify system DNS recovery against the same public metadata
        run: |
          node --input-type=module - <<'NODE'
          import { verifyPublic } from './scripts/release-publisher/verify-public.mjs';
          await verifyPublic({
            fetchImpl(url, options) {
              if (new URL(url).hostname !== 'api.github.com')
                throw Object.assign(new Error('Controlled recovery-path check'), { code: 'UND_ERR_CONNECT_TIMEOUT' });
              return fetch(url, options);
            },
            dohFetchImpl() { throw new Error('System DNS recovery must succeed without DoH'); },
          }).then(latest => {
            console.log(`System DNS native recovery verified public FundsTrace ${latest.version} metadata`);
          }).catch(() => {
            console.error('System DNS native recovery failed; inspect the fixed endpoint diagnostics.');
            process.exitCode = 1;
          });
          NODE
      - name: Verify independent DNS recovery against the same public metadata
        run: |
          node --input-type=module - <<'NODE'
          import { verifyPublic } from './scripts/release-publisher/verify-public.mjs';
          const controlledFailure = () => {
            throw Object.assign(new Error('Controlled recovery-path check'), { code: 'UND_ERR_CONNECT_TIMEOUT' });
          };
          await verifyPublic({
            fetchImpl(url, options) {
              if (new URL(url).hostname !== 'api.github.com') return controlledFailure();
              return fetch(url, options);
            },
            nativeFetchImpl: controlledFailure,
          }).then(latest => {
            console.log(`Independent DNS native recovery verified public FundsTrace ${latest.version} metadata`);
          }).catch(() => {
            console.error('Independent DNS native recovery failed; inspect the fixed endpoint diagnostics.');
            process.exitCode = 1;
          });
          NODE
      - name: Diagnose failed public connections without cloud credentials
        if: failure()
        run: |
          node --input-type=module - <<'NODE'
          import { lookup } from 'node:dns/promises';
          import { get } from 'node:https';
          for (const hostname of ['analytix.top', 'download.analytix.top']) {
            try { console.log(JSON.stringify({ hostname, addresses: await lookup(hostname, { all: true }) })); }
            catch (error) { console.log(JSON.stringify({ hostname, code: error.code })); }
          }
          await Promise.all(['https://analytix.top/fundstrace/latest.yml',
            'https://download.analytix.top/releases/windows/site/fundstrace/latest.yml'].map(url => new Promise(resolve => {
              const state = { hostname: new URL(url).hostname, tcp: false, tls: false };
              const request = get(url, { family: 0, autoSelectFamily: true, agent: false,
                rejectUnauthorized: true, signal: AbortSignal.timeout(5000) }, response => {
                response.resume(); console.log(JSON.stringify({ ...state, status: response.statusCode })); resolve();
              });
              request.on('socket', socket => {
                socket.on('connect', () => { state.tcp = true; state.remote = socket.remoteAddress; });
                socket.on('secureConnect', () => { state.tls = true; });
              });
              request.on('error', error => { console.log(JSON.stringify({ ...state, code: error.code })); resolve(); });
            })));
          NODE
          for url in 'https://analytix.top/fundstrace/latest.yml' 'https://download.analytix.top/releases/windows/site/fundstrace/latest.yml'; do
            curl --ipv4 --silent --show-error --max-time 12 --connect-timeout 5 --max-filesize 65536 \
              --output "$RUNNER_TEMP/public-metadata.json" \
              --write-out 'url=%{url_effective} status=%{http_code} remote=%{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} first=%{time_starttransfer} exit=%{exitcode}\n' \
              "$url" || true
          done

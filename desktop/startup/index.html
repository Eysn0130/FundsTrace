<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>循迹 FundsTrace</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <main class="startup-surface" id="startup-surface" data-phase="waiting" aria-label="循迹 FundsTrace 正在启动">
    <div class="startup-backdrop" aria-hidden="true"></div>
    <div class="startup-atmosphere" aria-hidden="true"></div>
    <div class="startup-brand">
      <div class="startup-mark" aria-hidden="true">
        <img class="startup-icon" src="../assets/icon.png" alt="" draggable="false">
        <span class="startup-original-light"><span class="startup-original-sweep"></span></span>
        <span class="startup-amber"><span class="startup-amber-light"></span></span>
      </div>
      <div class="startup-caption">
        <div class="startup-cn-name">循迹</div>
        <div class="startup-wordmark">FundsTrace</div>
        <div class="startup-subtitle">资金流水追踪与关联分析</div>
      </div>
      <div class="startup-wait" role="status">
        <div class="startup-wait-track" aria-hidden="true"><span></span></div>
        <span class="startup-wait-label">正在加载工作区</span>
      </div>
    </div>
  </main>
</body>
</html>

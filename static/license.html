<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.svg">
<title>系统激活 · FundsTrace</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #14161a 0%, #1b2430 100%);
  font: 14px/1.7 "Microsoft YaHei", sans-serif; color: #e8ebf0; }
.card { width: 520px; max-width: 94vw; background: #191c22; border: 1px solid #2a2e37;
  border-radius: 14px; padding: 34px 38px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.logo { text-align: center; margin-bottom: 6px; }
.logo img { width: 64px; height: 64px; border-radius: 50%; }
h1 { text-align: center; font-size: 20px; margin: 10px 0 2px; }
.sub { text-align: center; color: #8a94a2; font-size: 12px; margin-bottom: 22px; }
.step { display: flex; align-items: flex-start; gap: 10px; margin: 14px 0; }
.step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #3d7bff;
  color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.step .b { flex: 1; }
.step .b .t { font-size: 13px; }
.step .b .d { font-size: 12px; color: #8a94a2; }
.codebox { display: flex; align-items: center; gap: 8px; background: #10131a;
  border: 1px solid #333945; border-radius: 8px; padding: 10px 12px; margin-top: 6px; }
.codebox .code { flex: 1; font-family: Consolas, monospace; font-size: 15px; letter-spacing: 1px;
  color: #ffd700; word-break: break-all; user-select: all; }
.btn { background: #23272f; color: #dfe3ea; border: 1px solid #333945; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; font-size: 12px; }
.btn.primary { background: #3d7bff; border-color: #3d7bff; color: #fff; font-size: 14px; }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; }
#key { width: 100%; background: #1e2128; color: #e8ebf0; border: 1px solid #333945;
  border-radius: 6px; padding: 9px 12px; font-size: 13px; margin-top: 6px; outline: none; }
#key:focus { border-color: #3d7bff; }
#msg { min-height: 20px; font-size: 12px; margin: 8px 0; }
#msg.err { color: #eda1a1; } #msg.ok { color: #9fdcae; }
.wm { text-align: center; color: #555; font-size: 11px; margin-top: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="/static/logo.svg" alt=""></div>
  <h1>FundsTrace <small style="color:#ffd700;font-size:12px">本地分析</small></h1>
  <div class="sub">FundsTrace · 系统激活</div>

  <div class="step">
    <div class="n">1</div>
    <div class="b"><div class="t">复制本机机器码，发给系统管理员</div>
      <div class="d">微信/短信发送均可，管理员据此生成授权码</div>
      <div class="codebox"><span class="code" id="mc">读取中…</span>
        <button class="btn" id="btnCopyMc">复制</button></div>
    </div>
  </div>
  <div class="step">
    <div class="n">2</div>
    <div class="b"><div class="t">输入管理员返回的授权码</div>
      <input id="key" placeholder="粘贴授权码后点击激活">
    </div>
  </div>
  <div class="step">
    <div class="n">3</div>
    <div class="b"><button class="btn primary" id="btnAct" style="width:100%;padding:9px">激 活 系 统</button></div>
  </div>
  <div id="msg"></div>
  <div class="wm">FundsTrace · FundsTrace</div>
</div>
<script src="/static/license.js?v=1"></script>
</body>
</html>

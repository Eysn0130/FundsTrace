<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.svg">
<title>智能分析 · FundsTrace</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { color-scheme: dark; }
body { background: #10171f; color: #e8eef6; font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
button, input, select, textarea { font-family: inherit; }
a { color: #7ab8f0; text-decoration: none; }
header { display: flex; align-items: center; gap: 10px 14px; min-height: 50px; padding: 10px 16px; flex-wrap: wrap;
         background: #151e28; border-bottom: 1px solid #2e3b4a; }
header img { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; }
header h1 { font-size: 16px; min-width: 0; }
header h1 span { color: #b8c9db; font-size: 12px; border: 1px solid #40516a; border-radius: 9px; padding: 1px 7px; margin-left: 6px; }
header .back { margin-left: auto; }
main { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
#panel { width: 320px; min-width: 0; flex: 0 0 320px; background: #151e28; border: 1px solid #2e3b4a; border-radius: 10px; padding: 14px; }
#results { flex: 1; min-width: 0; }
h2 { font-size: 14px; margin: 14px 0 8px; padding-left: 8px; border-left: 3px solid #3d7bff; }
.sec { margin-bottom: 14px; }
.sec .t { color: #9aa4b2; font-size: 12px; margin-bottom: 6px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
.row label { width: 110px; color: #9aa4b2; font-size: 12px; }
.row input, .row select { background: #1e2128; color: #e8ebf0; border: 1px solid #333945;
  border-radius: 5px; padding: 5px 8px; font-size: 12px; width: 150px; }
.row input.wide { flex: 1; width: auto; min-width: 0; }
.row label:has(input.alg) { width: auto; }
.btn { background: #23272f; color: #dfe3ea; border: 1px solid #333945; border-radius: 6px;
       padding: 6px 14px; cursor: pointer; font-size: 12px; white-space: nowrap; flex: 0 0 auto; min-height: 32px; }
.btn.primary { background: #3d7bff; border-color: #3d7bff; color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.pbar { position: relative; height: 20px; background: #1e2128; border: 1px solid #333945;
        border-radius: 6px; overflow: hidden; margin: 10px 0; }
.pbar .pfill { height: 100%; width: 0; background: linear-gradient(90deg, #2f6fe0, #3d7bff); transition: width .3s; }
.pbar.indeterminate .pfill { width: 38% !important; background: linear-gradient(90deg,#2f6fe0,#3d7bff,#2f6fe0);
  background-size: 200% 100%; animation: mv 1.1s linear infinite; }
@keyframes mv { 0% { margin-left: -38%; } 100% { margin-left: 100%; } }
.card { background: #151e28; border: 1px solid #2e3b4a; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.card h3 { font-size: 13px; margin-bottom: 4px; }
.card .principle { color: #a8b6c7; font-size: 12px; margin-bottom: 8px; }
.card .count { color: #ffd700; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
th { background: #20242c; color: #9aa4b2; text-align: left; padding: 5px 8px; border-bottom: 1px solid #2a2e37; }
td { padding: 5px 8px; border-bottom: 1px solid #23272f; vertical-align: top; }
tr:hover td { background: #1c2027; }
.mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: #9aa4b2; }
.amt { color: #f0c674; white-space: nowrap; }
.empty { color: #a8b6c7; padding: 8px 4px; }
.tag { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 12px; background: #2a2e37; color: #9aa4b2; margin-right: 4px; }
.tag.gold { background: #3d3214; color: #ffd700; }
.tag.blue { background: #14283a; color: #7ab8f0; }
.tag.red { background: #3a1e2a; color: #e08a9a; }
.hint { color: #a8b6c7; font-size: 12px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: #367cff; vertical-align: middle; }
input:disabled { opacity: .5; }
select { appearance: none; background: #17212c url('/static/ui-icons/chevron-down.svg') no-repeat right 8px center / 14px; border: 1px solid #344456; border-radius: 4px; color: #e8eef6; padding: 7px 28px 7px 8px; min-height: 34px; }
.btn { font-family: inherit; transition: background 150ms ease, border-color 150ms ease; }
.btn:hover:not(:disabled) { background: #2a394a; border-color: #567292; }
.btn.primary:hover:not(:disabled) { background: #4d8bff; }
.btn:active:not(:disabled) { background: #30445c; }
.amt { text-align: right; font-variant-numeric: tabular-nums; }
.table-scroll:focus-visible { outline: 2px solid #7ab8f0; outline-offset: 2px; }
.sec > .t { display: block; }
.table-scroll { max-width: 100%; overflow-x: auto; }
.table-scroll table { min-width: 560px; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #7ab8f0; outline-offset: 3px; }
@media (max-width: 820px) { main { flex-direction: column; } #panel { width: 100%; flex-basis: auto; } #results { width: 100%; } }
@media (max-width: 480px) { header { padding: 10px; } header h1 { font-size: 14px; } header h1 span { display: block; width: fit-content; margin: 3px 0 0; } header .back { margin-left: 0; } main { padding: 10px; } .row input, .row select { max-width: 100%; } }
@media (prefers-reduced-motion: reduce) { .pbar .pfill, .btn { transition: none; animation: none; } .pbar.indeterminate .pfill { margin-left: 31%; } }
#watermark { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
</style>
</head>
<body>
<header>
  <img src="/static/logo.svg" alt="">
  <h1>智能分析 <span>本地分析 · 算法模块</span></h1>
  <a class="btn back" id="backToGraph" href="/">← 返回追踪系统</a>
</header>
<main>
  <div id="panel">
    <div class="sec">
      <label class="t" for="caseSel">分析案件</label>
      <select id="caseSel" style="width:100%"></select>
      <div class="hint" id="caseStats"></div>
    </div>
    <div class="sec">
      <div class="t">启用算法</div>
      <div class="row"><label><input type="checkbox" class="alg" value="cycles" checked> 环路检测（资金回流）</label></div>
      <div class="row" style="padding-left:20px"><label for="cycDays">环流时限(天)</label><input id="cycDays" type="number" value="7" min="1" max="365" style="width:80px"></div>
      <div class="row"><label><input type="checkbox" class="alg" value="fast_flows" checked> 快进快出配对</label></div>
      <div class="row"><label><input type="checkbox" class="alg" value="outliers" checked> 离群账户画像</label></div>
      <div class="row"><label><input type="checkbox" class="alg" value="paths"> 路径追踪（需填起终点）</label></div>
      <div class="sec">
        <label class="t" for="subjects">分析对象（可选，作用于环路/快进快出/离群）</label>
        <textarea id="subjects" rows="3" style="width:100%;background:#1e2128;color:#e8ebf0;border:1px solid #333945;border-radius:5px;padding:5px 8px;font-size:12px"
          placeholder="输入合成账号或户名，逗号/换行分隔。留空分析全案件。例：SYN-A, SYN-B"></textarea>
      </div>
    </div>
    <div class="sec" id="pathParams" style="display:none">
      <div class="t">路径追踪参数</div>
      <div class="row"><label for="pSrc">起点账号</label><input id="pSrc" class="wide" placeholder="资金流出起点账号"></div>
      <div class="row"><label for="pDst">终点账号</label><input id="pDst" class="wide" placeholder="资金最终流向账号"></div>
      <div class="row"><label for="pHops">最大跳数</label><input id="pHops" type="number" value="4" min="1" max="12"></div>
    </div>
    <div class="sec">
      <div class="t">通用参数</div>
      <div class="hint">暂未提供拆分分析，以下拆分参数不可用。</div>
      <div class="row"><label for="splitDays">拆分窗口(天)</label><input id="splitDays" type="number" value="3" min="1" max="30" disabled></div>
      <div class="row"><label for="splitMin">单笔区间(万)</label>
        <input id="splitMin" disabled type="number" value="2" step="0.5" style="width:60px">
        <span>~</span><input id="splitMax" aria-label="拆分单笔金额上限（万）" disabled type="number" value="4.95" step="0.5" style="width:60px"></div>
      <div class="row"><label for="ffWin">快进快出窗口(分)</label><input id="ffWin" type="number" value="30" min="5" max="1440"></div>
      <div class="row"><label for="ffTol">配对金额容差</label><input id="ffTol" type="number" value="0.25" step="0.05" min="0" max="1"></div>
    </div>
    <button class="btn primary" id="btnRun" style="width:100%;padding:9px">开始分析</button>
    <button class="btn" id="btnReport" style="width:100%;margin-top:8px" disabled>导出分析报告（HTML）</button>
    <div class="pbar" id="pbar" role="status" aria-label="分析中" style="display:none"><div class="pfill" id="pfill"></div></div>
    <div class="hint">分析基于当前案件已导入的全部流水；结果为算法辅助判断，定案以人工核实为准。</div>
  </div>
  <div id="results"><div class="card"><div class="hint">选择算法与参数后点击「开始分析」。结果将在此展示，并可导出为文字+图表的 HTML 分析报告。</div></div></div>
</main>
<div id="watermark"></div>
<script src="/static/money.js?v=1"></script>
<script src="/static/analysis.js?v=release-ui-1"></script>
</body>
</html>

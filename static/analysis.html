<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/favicon-32.png" sizes="32x32">
<title>全案分析 · FundsTrace</title>
<link rel="stylesheet" href="/static/style.css?v=analysis-workspace-1">
<link rel="stylesheet" href="/static/analysis.css?v=analysis-workspace-1">
<link rel="stylesheet" href="/static/appearance.css">
<link rel="stylesheet" href="/static/entity-picker.css">
<link rel="stylesheet" href="/static/entity-search.css">
<script src="/static/appearance.js"></script>
</head>
<body class="analysis-workspace">
<header class="analysis-topbar">
  <div class="analysis-brand"><img src="/static/logo.png" alt="" width="30" height="30"><span>FundsTrace</span></div>
  <span class="analysis-page-label">全案分析</span>
  <label class="sr-only" for="caseSel">分析案件</label><select id="caseSel" aria-label="分析案件" disabled><option>正在读取案件…</option></select>
  <a class="btn analysis-back" id="backToGraph" href="/"><img class="ui-icon" src="/static/ui-icons/chevron-left.svg" alt="">返回图谱</a>
  <div class="analysis-case-status"><span id="caseStats">正在读取案件…</span><button class="btn small" id="caseRetry" type="button" hidden>重新读取案件</button><button class="btn small" id="statsRetry" type="button" hidden>重试统计</button></div>
</header>
<main class="analysis-layout">
  <aside id="panel" class="analysis-panel" aria-label="分析配置">
    <div id="analysisParams" class="analysis-parameter-scroll">
      <h2>分析配置</h2>
      <fieldset class="analysis-algorithms"><legend>检测算法 <span>（可多选）</span></legend>
        <label><input type="checkbox" class="alg" value="cycles" checked><span>环路检测</span><span class="analysis-alg-count" data-alg-count="cycles" aria-label="环路检测本次结果数">—</span></label>
        <label><input type="checkbox" class="alg" value="fast_flows" checked><span>快进快出</span><span class="analysis-alg-count" data-alg-count="fast_flows" aria-label="快进快出本次结果数">—</span></label>
        <label><input type="checkbox" class="alg" value="outliers" checked><span>离群画像</span><span class="analysis-alg-count" data-alg-count="outliers" aria-label="离群画像本次结果数">—</span></label>
        <label><input type="checkbox" class="alg" value="paths"><span>路径追踪</span><span class="analysis-alg-count" data-alg-count="paths" aria-label="路径追踪本次结果数">—</span></label>
      </fieldset>
      <section class="analysis-parameter-section" id="subjectParams" aria-labelledby="subjectTitle"><h3 id="subjectTitle"><label for="subjects">分析对象</label><span>可选</span></h3>
        <textarea id="subjects" rows="1" placeholder="全部账户" aria-describedby="subjectsHint"></textarea><p class="analysis-field-note" id="subjectsHint">账号或户名，逗号/换行分隔 · 不作用于路径</p>
      </section>
      <section class="analysis-parameter-section analysis-methods" aria-labelledby="parameterTitle"><h3 id="parameterTitle">算法参数</h3>
        <div id="cycleParams" class="analysis-method"><h4>环路检测</h4><div class="analysis-field"><label for="cycDays">环流时限（天）</label><input id="cycDays" type="number" value="7" min="1" max="365" placeholder="7"></div></div>
        <div id="ffParams" class="analysis-method"><h4>快进快出</h4><div class="analysis-field"><label for="ffWin">时间窗口（分钟）</label><input id="ffWin" type="number" value="30" min="5" max="1440" placeholder="30"></div><div class="analysis-field"><label for="ffTol">金额容差（%）</label><input id="ffTol" type="number" value="25" min="0" max="100" step="any" placeholder="25"></div></div>
        <div id="pathParams" class="analysis-method" hidden><h4>路径追踪</h4><div class="analysis-field"><label class="analysis-required" for="pSrc">起点账号／户名 <span aria-hidden="true">*</span></label><input id="pSrc" placeholder="账号或户名" autocomplete="off"></div><div class="analysis-field"><label class="analysis-required" for="pDst">终点账号／户名 <span aria-hidden="true">*</span></label><input id="pDst" placeholder="账号或户名" autocomplete="off"></div><div class="analysis-field"><label for="pHops">最大跳数</label><input id="pHops" type="number" value="4" min="1" max="12" placeholder="4"></div><div class="analysis-field"><label for="pOrder">路径顺序</label><select id="pOrder"><option value="amount">金额优先</option><option value="time">时间优先</option></select></div></div>
        <p id="outlierParams" class="analysis-field-note" hidden>离群画像 · 2.5σ · 按币种比较</p>
      </section>
    </div>
    <footer class="analysis-panel-footer"><div id="draftStatus" class="analysis-draft" role="status" aria-live="polite"></div><div id="pbar" class="analysis-working" hidden role="status"><img id="pfill" class="ui-icon" src="/static/ui-icons/refresh.svg" alt=""><span>分析中…</span></div><button class="btn primary" id="btnRun" type="button" disabled>开始分析</button></footer>
  </aside>
  <section class="analysis-results-workspace" aria-labelledby="analysisTitle">
    <div class="analysis-title-row"><div class="analysis-heading"><h1 id="analysisTitle">全案分析</h1><span id="runStatus" class="analysis-run-status" role="status" aria-live="polite"></span><span id="analysisScopeNote" class="analysis-scope-note"></span></div><div class="analysis-report"><button class="btn" id="btnReport" type="button" disabled><img class="ui-icon" src="/static/ui-icons/file-export.svg" alt=""><span>生成HTML报告</span></button><span>按本次结果参数重新计算</span></div></div>
    <div id="analysisError" class="analysis-error" role="alert" hidden></div><div id="reportStatus" class="analysis-report-status" role="status" aria-live="polite"></div>
    <div id="resultTabs" class="analysis-result-tabs" role="tablist" aria-label="本次分析结果分类"></div>
    <section id="results" class="analysis-results" role="tabpanel" aria-label="分析结果"><div class="analysis-empty">尚未运行分析</div></section>
    <footer class="analysis-results-footer"><span id="resultScope">本地分析 · 全部导入流水</span><span>需人工复核</span></footer>
  </section>
</main>
<dialog id="analysisConfirm" class="action-dialog analysis-confirm" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><header class="action-dialog-head"><h2 id="confirmTitle"></h2><button class="btn small icon-button" id="confirmClose" type="button" aria-label="关闭确认"><img class="ui-icon" src="/static/ui-icons/x.svg" alt=""></button></header><div class="analysis-confirm-body"><p id="confirmMessage"></p></div><footer class="action-dialog-actions"><button class="btn" id="confirmCancel" type="button">取消</button><button class="btn primary" id="confirmAccept" type="button">确定</button></footer></dialog>
<div id="watermark" aria-hidden="true"></div>
<script src="/static/money.js?v=1"></script>
<script src="/static/table-scroll.js?v=1"></script>
<script src="/static/entity-picker.js?v=1"></script>
<script src="/static/entity-search.js?v=1"></script>
<script src="/static/analysis.js?v=analysis-workspace-1"></script>
<script src="/static/analysis-link.js"></script>
</body>
</html>
